name: Build SideloadTW Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate SideloadTW App Icons & Compile Native iOS IPA
        run: |
          mkdir -p Payload/AUDTWDPro.app
          if [ -f "index.html" ]; then
            cp index.html Payload/AUDTWDPro.app/index.html
          else
            echo "請確認已上傳 index.html 到儲存庫根目錄！"
            exit 1
          fi

          cat << 'EOF' > make_icon.swift
          import Cocoa

          func renderIcon(size: CGFloat, filename: String) {
              let img = NSImage(size: NSSize(width: size, height: size))
              img.lockFocus()
              guard let ctx = NSGraphicsContext.current?.cgContext else { return }

              let rect = CGRect(x: 0, y: 0, width: size, height: size)
              ctx.setFillColor(CGColor(red: 0.02, green: 0.02, blue: 0.03, alpha: 1.0))
              ctx.fill(rect)

              let borderRect = rect.insetBy(dx: size * 0.05, dy: size * 0.05)
              let borderPath = NSBezierPath(roundedRect: borderRect, xRadius: size * 0.18, yRadius: size * 0.18)
              NSColor(calibratedRed: 0.0, green: 0.90, blue: 1.0, alpha: 0.45).setStroke()
              borderPath.lineWidth = size * 0.025
              borderPath.stroke()

              let center = CGPoint(x: size * 0.5, y: size * 0.5)
              let cyanArc = NSBezierPath()
              cyanArc.appendArc(withCenter: center, radius: size * 0.30, startAngle: 20, endAngle: 195)
              NSColor(calibratedRed: 0.0, green: 0.90, blue: 1.0, alpha: 1.0).setStroke()
              cyanArc.lineWidth = size * 0.085
              cyanArc.lineCapStyle = .round
              cyanArc.stroke()

              let goldArc = NSBezierPath()
              goldArc.appendArc(withCenter: center, radius: size * 0.30, startAngle: 200, endAngle: 15)
              NSColor(calibratedRed: 0.96, green: 0.69, blue: 0.25, alpha: 1.0).setStroke()
              goldArc.lineWidth = size * 0.085
              goldArc.lineCapStyle = .round
              goldArc.stroke()

              let arrow = NSBezierPath()
              arrow.move(to: NSPoint(x: size * 0.5, y: size * 0.68))
              arrow.line(to: NSPoint(x: size * 0.5, y: size * 0.32))
              arrow.move(to: NSPoint(x: size * 0.36, y: size * 0.46))
              arrow.line(to: NSPoint(x: size * 0.5, y: size * 0.32))
              arrow.line(to: NSPoint(x: size * 0.64, y: size * 0.46))
              NSColor.white.setStroke()
              arrow.lineWidth = size * 0.065
              arrow.lineCapStyle = .round
              arrow.lineJoinStyle = .round
              arrow.stroke()

              img.unlockFocus()
              if let tiff = img.tiffRepresentation,
                 let rep = NSBitmapImageRep(data: tiff),
                 let png = rep.representation(using: .png, properties: [:]) {
                  try? png.write(to: URL(fileURLWithPath: filename))
              }
          }

          renderIcon(size: 120, filename: "Payload/AUDTWDPro.app/AppIcon60x60@2x.png")
          renderIcon(size: 180, filename: "Payload/AUDTWDPro.app/AppIcon60x60@3x.png")
          EOF
          swift make_icon.swift

          cat << 'EOF' > App.swift
          import UIKit
          import WebKit
          import Foundation

          class RateFetcher: NSObject, WKScriptMessageHandler {
              weak var webView: WKWebView?
              func userContentController(_ userContentController: WKUserContentController, didReceive message: WKScriptMessage) {
                  if message.name == "fetchNativeRates" { fetchAll() }
              }
              func fetchAll() {
                  let group = DispatchGroup()
                  var midAudTwd: Double? = nil
                  var botUsdTwdBuy: Double? = nil
                  var wiseAudUsd: Double? = nil
                  var csUsdtAud: Double? = nil
                  var maxUsdtTwd: Double? = nil

                  if let botUrl = URL(string: "https://rate.bot.com.tw/xrt/flcsv/0/day") {
                      group.enter()
                      URLSession.shared.dataTask(with: botUrl) { data, _, _ in
                          defer { group.leave() }
                          if let data = data, let csv = String(data: data, encoding: .utf8) {
                              for line in csv.components(separatedBy: .newlines) {
                                  let cols = line.components(separatedBy: ",")
                                  if cols.count > 13 {
                                      if cols[0] == "AUD", let b = Double(cols[3]), let s = Double(cols[13]), b > 0, s > 0 {
                                          midAudTwd = ((b + s) / 2.0 * 10000).rounded() / 10000
                                      }
                                      if cols[0] == "USD", let b = Double(cols[3]), b > 0 {
                                          botUsdTwdBuy = (b * 1000).rounded() / 1000
                                      }
                                  }
                              }
                          }
                      }.resume()
                  }

                  if let fxUrl = URL(string: "https://open.er-api.com/v6/latest/AUD") {
                      group.enter()
                      URLSession.shared.dataTask(with: fxUrl) { data, _, _ in
                          defer { group.leave() }
                          if let data = data,
                             let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                             let rates = json["rates"] as? [String: Any] {
                              if midAudTwd == nil, let twd = rates["TWD"] as? Double { midAudTwd = (twd * 10000).rounded() / 10000 }
                              if let usd = rates["USD"] as? Double { wiseAudUsd = (usd * 10000).rounded() / 10000 }
                          }
                      }.resume()
                  }

                  if let csUrl = URL(string: "https://www.coinspot.com.au/pubapi/v2/latest") {
                      group.enter()
                      URLSession.shared.dataTask(with: csUrl) { data, _, _ in
                          defer { group.leave() }
                          if let data = data,
                             let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                             let prices = json["prices"] as? [String: Any],
                             let usdt = prices["usdt"] as? [String: Any],
                             let askStr = usdt["ask"] as? String,
                             let ask = Double(askStr) { csUsdtAud = (ask * 10000).rounded() / 10000 }
                      }.resume()
                  }

                  if let maxUrl = URL(string: "https://max-api.maicoin.com/api/v2/tickers/usdttwd") {
                      group.enter()
                      URLSession.shared.dataTask(with: maxUrl) { data, _, _ in
                          defer { group.leave() }
                          if let data = data,
                             let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                             let buyStr = json["buy"] as? String,
                             let buy = Double(buyStr) { maxUsdtTwd = (buy * 10000).rounded() / 10000 }
                      }.resume()
                  }

                  group.notify(queue: .main) { [weak self] in
                      var dict: [String: Double] = [:]
                      if let m = midAudTwd { dict["midAudTwd"] = m }
                      if let u = botUsdTwdBuy { dict["botUsdTwdBuy"] = u }
                      if let w = wiseAudUsd { dict["wiseAudUsd"] = w }
                      if let c = csUsdtAud { dict["csUsdtAud"] = c }
                      if let x = maxUsdtTwd { dict["maxUsdtTwd"] = x }
                      if let jsonData = try? JSONSerialization.data(withJSONObject: dict),
                         let jsonStr = String(data: jsonData, encoding: .utf8) {
                          self?.webView?.evaluateJavaScript("window.__updateNativeRates && window.__updateNativeRates(\(jsonStr));", completionHandler: nil)
                      }
                  }
              }
          }

          class ViewController: UIViewController {
              var webView: WKWebView!
              let fetcher = RateFetcher()
              override var preferredStatusBarStyle: UIStatusBarStyle { return .lightContent }
              override func viewDidLoad() {
                  super.viewDidLoad()
                  let bg = UIColor(red: 5/255, green: 5/255, blue: 8/255, alpha: 1.0)
                  view.backgroundColor = bg
                  let cc = WKUserContentController()
                  cc.add(fetcher, name: "fetchNativeRates")
                  let config = WKWebViewConfiguration()
                  config.userContentController = cc
                  webView = WKWebView(frame: view.bounds, configuration: config)
                  webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  webView.isOpaque = false
                  webView.backgroundColor = bg
                  webView.scrollView.backgroundColor = bg
                  webView.scrollView.bounces = false
                  webView.scrollView.alwaysBounceHorizontal = false
                  webView.scrollView.contentInsetAdjustmentBehavior = .never
                  fetcher.webView = webView
                  view.addSubview(webView)
                  if let htmlPath = Bundle.main.path(forResource: "index", ofType: "html"),
                     let htmlString = try? String(contentsOfFile: htmlPath, encoding: .utf8) {
                      webView.loadHTMLString(htmlString, baseURL: URL(string: "https://sideloadtw.local/"))
                  }
              }
          }

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.rootViewController = ViewController()
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          EOF

          xcrun -sdk iphoneos swiftc -parse-as-library App.swift \
            -target arm64-apple-ios15.0 -O \
            -framework UIKit -framework WebKit -framework Foundation \
            -o Payload/AUDTWDPro.app/AUDTWDPro

          cat << 'EOF' > Payload/AUDTWDPro.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>zh_TW</string>
            <key>CFBundleDisplayName</key><string>Sideload匯兌</string>
            <key>CFBundleExecutable</key><string>AUDTWDPro</string>
            <key>CFBundleIdentifier</key><string>com.sideloadtw.audtwdpro</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>AUDTWDPro</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>3.0.0</string>
            <key>CFBundleVersion</key><string>3</string>
            <key>CFBundleIcons</key>
            <dict>
              <key>CFBundlePrimaryIcon</key>
              <dict>
                <key>CFBundleIconFiles</key>
                <array><string>AppIcon60x60</string></array>
                <key>UIPrerenderedIcon</key><true/>
              </dict>
            </dict>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>MinimumOSVersion</key><string>15.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
            <key>UILaunchScreen</key><dict/>
            <key>UIStatusBarStyle</key><string>UIStatusBarStyleLightContent</string>
            <key>UISupportedInterfaceOrientations</key>
            <array><string>UIInterfaceOrientationPortrait</string></array>
            <key>NSAppTransportSecurity</key>
            <dict><key>NSAllowsArbitraryLoads</key><true/></dict>
          </dict>
          </plist>
          EOF

          echo -n "APPL????" > Payload/AUDTWDPro.app/PkgInfo
          codesign --force --sign - --timestamp=none Payload/AUDTWDPro.app
          zip -r -y SideloadTW-AUD-TWD-Pro.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideloadTW-AUD-TWD-Pro-IPA
          path: SideloadTW-AUD-TWD-Pro.ipa
