name: Build SideloadTW Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Borderless SideloadTW Icon & Compile Native iOS IPA
        run: |
          mkdir -p Payload/AUDTWDPro.app
          if [ -f "index.html" ]; then
            cp index.html Payload/AUDTWDPro.app/index.html
          else
            echo "請確認已上傳 index.html 到儲存庫根目錄！"
            exit 1
          fi

          python3 - << 'PYEOF'
          import re, base64, subprocess
          with open("index.html", "r", encoding="utf-8") as f:
              text = f.read()
          m = re.search(r'data:image/png;base64,([A-Za-z0-9+/=]+)', text)
          if m:
              raw = base64.b64decode(m.group(1))
              with open("Payload/AUDTWDPro.app/AppIcon60x60@3x.png", "wb") as out:
                  out.write(raw)
              subprocess.run(["sips", "-z", "120", "120", "Payload/AUDTWDPro.app/AppIcon60x60@3x.png", "--out", "Payload/AUDTWDPro.app/AppIcon60x60@2x.png"], check=False)
          PYEOF

          cat << 'EOF' > App.swift
          import UIKit
          import WebKit
          import Foundation

          class RateFetcher: NSObject, WKScriptMessageHandler {
              weak var webView: WKWebView?
              func userContentController(_ userContentController: WKUserContentController, didReceive message: WKScriptMessage) {
                  if message.name == "fetchNativeRates" { fetchAll() }
              }
              func fetchAll() {
                  let group = DispatchGroup()
                  var midAudTwd: Double? = nil
                  var botAudBuy: Double? = nil
                  var botUsdTwdBuy: Double? = nil
                  var botUsdMid: Double? = nil
                  var wiseMidRate: Double? = nil
                  var wiseFlatFee: Double? = nil
                  var wiseVarPct: Double? = nil
                  var cbaEstimated = false
                  var csUsdtAud: Double? = nil
                  var maxUsdtTwd: Double? = nil
                  var cbaAudTwd: Double? = nil
                  var visaAudTwd: Double? = nil

                  // 0. 直連 Visa 官方匯率轉換器 API (visa.com.tw, 0% 銀行手續費, TWD -> AUD)
                  let df = DateFormatter()
                  df.dateFormat = "MM/dd/yyyy"
                  let dateStr = df.string(from: Date()).addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? "11%2F07%2F2026"
                  if let visaUrl = URL(string: "https://www.visa.com.tw/cmsapi/fx/rates?amount=1&fee=0&utcConvertedDate=\(dateStr)&exchangedate=\(dateStr)&fromCurr=TWD&toCurr=AUD") {
                      group.enter()
                      var req = URLRequest(url: visaUrl)
                      req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)", forHTTPHeaderField: "User-Agent")
                      req.setValue("https://www.visa.com.tw/", forHTTPHeaderField: "Referer")
                      URLSession.shared.dataTask(with: req) { data, _, _ in
                          defer { group.leave() }
                          if let data = data,
                             let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                             let orig = json["originalValues"] as? [String: Any] {
                              if let rateStr = orig["fxRateWithAdditionalFee"] as? String, let r = Double(rateStr), r > 0 {
                                  let audToTwd = r < 1.0 ? (1.0 / r) : r
                                  visaAudTwd = (audToTwd * 10000).rounded() / 10000
                              } else if let rateNum = orig["fxRateVisa"] as? Double, rateNum > 0 {
                                  let audToTwd = rateNum < 1.0 ? (1.0 / rateNum) : rateNum
                                  visaAudTwd = (audToTwd * 10000).rounded() / 10000
                              }
                          }
                      }.resume()
                  }

                  // 1. 直連澳洲 CommBank 官方外匯牌告 JSON API (commbank.com.au)
                  if let cbaUrl = URL(string: "https://www.commbank.com.au/content/data/forex-rates/AUD.json") {
                      group.enter()
                      var req = URLRequest(url: cbaUrl)
                      req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)", forHTTPHeaderField: "User-Agent")
                      URLSession.shared.dataTask(with: req) { data, _, _ in
                          defer { group.leave() }
                          if let data = data,
                             let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                             let list = json["currencies"] as? [[String: Any]] {
                              for item in list {
                                  let code = (item["currencyTitle"] as? String) ?? (item["code"] as? String) ?? ""
                                  if code == "TWD" {
                                      // CommBank 未公布 TWD 電匯牌告（bbImt/bsImt 皆為 0），
                                      // 唯一有數值的 gfCash 是「Get foreign cash」外幣現鈔牌告，
                                      // 僅供參考顯示，App 內一律標示為「估算」。
                                      if let gfStr = item["gfCash"] as? String, let val = Double(gfStr), val > 0 {
                                          cbaAudTwd = (val * 10000).rounded() / 10000
                                          cbaEstimated = true
                                      } else if let gfNum = item["gfCash"] as? Double, gfNum > 0 {
                                          cbaAudTwd = (gfNum * 10000).rounded() / 10000
                                          cbaEstimated = true
                                      }
                                      break
                                  }
                              }
                          }
                      }.resume()
                  }

                  // 2. 直連台灣銀行官方牌告匯率 CSV
                  if let botUrl = URL(string: "https://rate.bot.com.tw/xrt/flcsv/0/day") {
                      group.enter()
                      URLSession.shared.dataTask(with: botUrl) { data, _, _ in
                          defer { group.leave() }
                          if let data = data, let csv = String(data: data, encoding: .utf8) {
                              for line in csv.components(separatedBy: .newlines) {
                                  let cols = line.components(separatedBy: ",").map { $0.trimmingCharacters(in: .whitespacesAndNewlines) }
                                  if cols.count > 13 {
                                      if cols[0] == "AUD", let b = Double(cols[3]), let s = Double(cols[13]), b > 0, s > 0 {
                                          midAudTwd = ((b + s) / 2.0 * 10000).rounded() / 10000
                                          botAudBuy = (b * 10000).rounded() / 10000
                                          if cbaAudTwd == nil {
                                              cbaAudTwd = (((b + s) / 2.0 * (1.0 - 0.0303)) * 10000).rounded() / 10000
                                              cbaEstimated = true
                                          }
                                      }
                                      if cols[0] == "USD", let b = Double(cols[3]), let s = Double(cols[13]), b > 0, s > 0 {
                                          botUsdTwdBuy = (b * 1000).rounded() / 1000
                                          botUsdMid = ((b + s) / 2.0 * 1000).rounded() / 1000
                                      }
                                  }
                              }
                          }
                      }.resume()
                  }

                  // 3. 國際外匯（ER-API，台銀 CSV 失敗時的備援）
                  if let fxUrl = URL(string: "https://open.er-api.com/v6/latest/AUD") {
                      group.enter()
                      URLSession.shared.dataTask(with: fxUrl) { data, _, _ in
                          defer { group.leave() }
                          if let data = data,
                             let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                             let rates = json["rates"] as? [String: Any] {
                              if midAudTwd == nil, let twd = rates["TWD"] as? Double {
                                  midAudTwd = (twd * 10000).rounded() / 10000
                                  botAudBuy = ((twd - 0.19) * 10000).rounded() / 10000
                              }
                          }
                      }.resume()
                  }

                  // 3b. Wise 官方直接 AUD→TWD 報價（OSKO 匯入 → 台灣銀行轉帳，無 USD 中轉）
                  if let wiseUrl = URL(string: "https://wise.com/gateway/v1/price?sourceAmount=1000&sourceCurrency=AUD&targetCurrency=TWD") {
                      group.enter()
                      var wiseReq = URLRequest(url: wiseUrl)
                      wiseReq.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)", forHTTPHeaderField: "User-Agent")
                      URLSession.shared.dataTask(with: wiseReq) { data, _, _ in
                          defer { group.leave() }
                          if let data = data,
                             let arr = try? JSONSerialization.jsonObject(with: data) as? [[String: Any]] {
                              let opt = arr.first(where: { ($0["payInMethod"] as? String) == "OSKO" && ($0["payOutMethod"] as? String) == "BANK_TRANSFER" })
                                  ?? arr.first(where: { ($0["payOutMethod"] as? String) == "BANK_TRANSFER" })
                                  ?? arr.first
                              if let o = opt,
                                 let mid = o["midRate"] as? Double, mid > 0,
                                 let flat = o["flatFee"] as? Double,
                                 let varPct = o["variableFeePercent"] as? Double {
                                  wiseMidRate = mid
                                  wiseFlatFee = flat
                                  wiseVarPct = varPct / 100.0
                              }
                          }
                      }.resume()
                  }

                  // 4. CoinSpot 官方 API
                  if let csUrl = URL(string: "https://www.coinspot.com.au/pubapi/v2/latest") {
                      group.enter()
                      URLSession.shared.dataTask(with: csUrl) { data, _, _ in
                          defer { group.leave() }
                          if let data = data,
                             let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                             let prices = json["prices"] as? [String: Any],
                             let usdt = prices["usdt"] as? [String: Any],
                             let askStr = usdt["ask"] as? String,
                             let ask = Double(askStr) { csUsdtAud = (ask * 10000).rounded() / 10000 }
                      }.resume()
                  }

                  // 5. 台灣 MAX 官方 API
                  if let maxUrl = URL(string: "https://max-api.maicoin.com/api/v2/tickers/usdttwd") {
                      group.enter()
                      URLSession.shared.dataTask(with: maxUrl) { data, _, _ in
                          defer { group.leave() }
                          if let data = data,
                             let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                             let buyStr = json["buy"] as? String,
                             let buy = Double(buyStr) { maxUsdtTwd = (buy * 10000).rounded() / 10000 }
                      }.resume()
                  }

                  group.notify(queue: .main) { [weak self] in
                      var dict: [String: Double] = [:]
                      if let m = midAudTwd { dict["midAudTwd"] = m }
                      if let v = visaAudTwd { dict["visaAudTwd"] = v }
                      if let b = botAudBuy { dict["botAudBuy"] = b }
                      if let c = cbaAudTwd { dict["cbaAudTwd"] = c }
                      if let u = botUsdTwdBuy { dict["botUsdTwdBuy"] = u }
                      if let um = botUsdMid { dict["botUsdMid"] = um }
                      if let w = wiseMidRate { dict["wiseMidRate"] = w }
                      if let wf = wiseFlatFee { dict["wiseFlatFee"] = wf }
                      if let wv = wiseVarPct { dict["wiseVarPct"] = wv }
                      if cbaEstimated { dict["cbaEstimated"] = 1.0 }
                      if let cs = csUsdtAud { dict["csUsdtAud"] = cs }
                      if let x = maxUsdtTwd { dict["maxUsdtTwd"] = x }
                      if let jsonData = try? JSONSerialization.data(withJSONObject: dict),
                         let jsonStr = String(data: jsonData, encoding: .utf8) {
                          self?.webView?.evaluateJavaScript("window.__updateNativeRates && window.__updateNativeRates(\(jsonStr));", completionHandler: nil)
                      }
                  }
              }
          }

          class ViewController: UIViewController {
              var webView: WKWebView!
              let fetcher = RateFetcher()
              var bgTask: UIBackgroundTaskIdentifier = .invalid

              override var preferredStatusBarStyle: UIStatusBarStyle { return .lightContent }
              override func viewDidLoad() {
                  super.viewDidLoad()
                  let bg = UIColor(red: 11/255, green: 11/255, blue: 12/255, alpha: 1.0)
                  view.backgroundColor = bg
                  let cc = WKUserContentController()
                  cc.add(fetcher, name: "fetchNativeRates")
                  let config = WKWebViewConfiguration()
                  config.userContentController = cc
                  webView = WKWebView(frame: view.bounds, configuration: config)
                  webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  webView.isOpaque = true
                  webView.backgroundColor = bg
                  webView.scrollView.backgroundColor = bg
                  webView.scrollView.bounces = false
                  webView.scrollView.alwaysBounceVertical = false
                  webView.scrollView.alwaysBounceHorizontal = false
                  webView.scrollView.contentInsetAdjustmentBehavior = .never
                  fetcher.webView = webView
                  view.addSubview(webView)
                  if let htmlPath = Bundle.main.path(forResource: "index", ofType: "html"),
                     let htmlString = try? String(contentsOfFile: htmlPath, encoding: .utf8) {
                      webView.loadHTMLString(htmlString, baseURL: URL(string: "https://sideloadtw.local/"))
                  }

                  NotificationCenter.default.addObserver(forName: UIApplication.didEnterBackgroundNotification, object: nil, queue: .main) { [weak self] _ in
                      guard let self = self else { return }
                      self.bgTask = UIApplication.shared.beginBackgroundTask(withName: "RateSyncBgTask") {
                          UIApplication.shared.endBackgroundTask(self.bgTask)
                          self.bgTask = .invalid
                      }
                  }
                  NotificationCenter.default.addObserver(forName: UIApplication.willEnterForegroundNotification, object: nil, queue: .main) { [weak self] _ in
                      guard let self = self else { return }
                      if self.bgTask != .invalid {
                          UIApplication.shared.endBackgroundTask(self.bgTask)
                          self.bgTask = .invalid
                      }
                      self.webView?.evaluateJavaScript("window.checkClockTick && window.checkClockTick();", completionHandler: nil)
                  }
              }
          }

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.rootViewController = ViewController()
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          EOF

          xcrun -sdk iphoneos swiftc -parse-as-library App.swift \
            -target arm64-apple-ios15.0 -O \
            -framework UIKit -framework WebKit -framework Foundation \
            -o Payload/AUDTWDPro.app/AUDTWDPro

          cat << 'EOF' > Payload/AUDTWDPro.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>zh_TW</string>
            <key>CFBundleDisplayName</key><string>AUD⇄TWD</string>
            <key>CFBundleExecutable</key><string>AUDTWDPro</string>
            <key>CFBundleIdentifier</key><string>com.sideloadtw.audtwdpro</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>AUDTWDPro</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>10.0.1</string>
            <key>CFBundleVersion</key><string>11</string>
            <key>CFBundleIcons</key>
            <dict>
              <key>CFBundlePrimaryIcon</key>
              <dict>
                <key>CFBundleIconFiles</key>
                <array><string>AppIcon60x60</string></array>
                <key>UIPrerenderedIcon</key><true/>
              </dict>
            </dict>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>MinimumOSVersion</key><string>15.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
            <key>UILaunchScreen</key><dict/>
            <key>UIStatusBarStyle</key><string>UIStatusBarStyleLightContent</string>
            <key>UISupportedInterfaceOrientations</key>
            <array><string>UIInterfaceOrientationPortrait</string></array>
            <key>NSAppTransportSecurity</key>
            <dict><key>NSAllowsArbitraryLoads</key><true/></dict>
          </dict>
          </plist>
          EOF

          echo -n "APPL????" > Payload/AUDTWDPro.app/PkgInfo
          codesign --force --sign - --timestamp=none Payload/AUDTWDPro.app
          zip -r -y SideloadTW-AUD-TWD-Pro.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideloadTW-AUD-TWD-Pro-IPA
          path: SideloadTW-AUD-TWD-Pro.ipa
