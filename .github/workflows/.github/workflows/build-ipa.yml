name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare React Web Bundle (Auto-detect App.jsx in root or src/)
        run: |
          mkdir -p web-build/src
          if [ -f "App.jsx" ]; then
            cp App.jsx web-build/src/App.jsx
          elif [ -f "src/App.jsx" ]; then
            cp src/App.jsx web-build/src/App.jsx
          elif [ -f "app.jsx" ]; then
            cp app.jsx web-build/src/App.jsx
          else
            echo "找不到 App.jsx，請確認已上傳 App.jsx 到 GitHub 儲存庫！"
            exit 1
          fi

          cd web-build
          cat << 'EOF' > package.json
          {
            "name": "aud-twd-pro",
            "private": true,
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "build": "vite build"
            },
            "dependencies": {
              "lucide-react": "^0.454.0",
              "react": "^18.3.1",
              "react-dom": "^18.3.1"
            },
            "devDependencies": {
              "@vitejs/plugin-react": "^4.3.3",
              "vite": "^5.4.10",
              "vite-plugin-singlefile": "^2.0.2"
            }
          }
          EOF

          cat << 'EOF' > vite.config.js
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';
          import { viteSingleFile } from 'vite-plugin-singlefile';

          export default defineConfig({
            plugins: [react(), viteSingleFile()],
            build: {
              outDir: 'dist',
              assetsInlineLimit: 100000000
            }
          });
          EOF

          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="zh-TW">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
              <title>AUD ⇄ TWD 匯兌精算 Pro</title>
              <script src="https://cdn.tailwindcss.com"></script>
              <style>
                body {
                  padding-top: env(safe-area-inset-top);
                  padding-bottom: env(safe-area-inset-bottom);
                  background-color: #020617;
                  -webkit-user-select: none;
                  user-select: none;
                  overscroll-behavior-y: none;
                }
              </style>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.jsx"></script>
            </body>
          </html>
          EOF

          cat << 'EOF' > src/main.jsx
          import React from 'react';
          import ReactDOM from 'react-dom/client';
          import App from './App.jsx';

          ReactDOM.createRoot(document.getElementById('root')).render(
            <React.StrictMode>
              <App />
            </React.StrictMode>
          );
          EOF

          npm install
          npx vite build

      - name: Compile Native iOS App & Package Unsigned IPA
        run: |
          mkdir -p Payload/AUDTWDPro.app
          cp web-build/dist/index.html Payload/AUDTWDPro.app/index.html

          cat << 'EOF' > main.swift
          import UIKit
          import WebKit
          import Foundation

          class RateFetcher: NSObject, WKScriptMessageHandler {
              weak var webView: WKWebView?

              func userContentController(_ userContentController: WKUserContentController, didReceive message: WKScriptMessage) {
                  if message.name == "fetchNativeRates" {
                      fetchAll()
                  }
              }

              func fetchAll() {
                  let group = DispatchGroup()
                  var midAudTwd: Double? = nil
                  var csUsdtAud: Double? = nil
                  var maxUsdtTwd: Double? = nil

                  if let url = URL(string: "https://open.er-api.com/v6/latest/AUD") {
                      group.enter()
                      URLSession.shared.dataTask(with: url) { data, _, _ in
                          defer { group.leave() }
                          if let data = data,
                             let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                             let rates = json["rates"] as? [String: Any],
                             let twd = rates["TWD"] as? Double {
                              midAudTwd = (twd * 10000).rounded() / 10000
                          }
                      }.resume()
                  }

                  if let url = URL(string: "https://www.coinspot.com.au/pubapi/v2/latest") {
                      group.enter()
                      URLSession.shared.dataTask(with: url) { data, _, _ in
                          defer { group.leave() }
                          if let data = data,
                             let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                             let prices = json["prices"] as? [String: Any],
                             let usdt = prices["usdt"] as? [String: Any],
                             let askStr = usdt["ask"] as? String,
                             let ask = Double(askStr) {
                              csUsdtAud = (ask * 10000).rounded() / 10000
                          }
                      }.resume()
                  }

                  if let url = URL(string: "https://max-api.maicoin.com/api/v2/tickers/usdttwd") {
                      group.enter()
                      URLSession.shared.dataTask(with: url) { data, _, _ in
                          defer { group.leave() }
                          if let data = data,
                             let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                             let buyStr = json["buy"] as? String,
                             let buy = Double(buyStr) {
                              maxUsdtTwd = (buy * 10000).rounded() / 10000
                          }
                      }.resume()
                  }

                  group.notify(queue: .main) { [weak self] in
                      var dict: [String: Double] = [:]
                      if let m = midAudTwd { dict["midAudTwd"] = m }
                      if let c = csUsdtAud { dict["csUsdtAud"] = c }
                      if let x = maxUsdtTwd { dict["maxUsdtTwd"] = x }
                      if let jsonData = try? JSONSerialization.data(withJSONObject: dict),
                         let jsonStr = String(data: jsonData, encoding: .utf8) {
                          self?.webView?.evaluateJavaScript("window.__updateNativeRates && window.__updateNativeRates(\(jsonStr));", completionHandler: nil)
                      }
                  }
              }
          }

          class ViewController: UIViewController {
              var webView: WKWebView!
              let fetcher = RateFetcher()

              override var preferredStatusBarStyle: UIStatusBarStyle {
                  return .lightContent
              }

              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = UIColor(red: 2/255, green: 6/255, blue: 23/255, alpha: 1.0)

                  let contentController = WKUserContentController()
                  contentController.add(fetcher, name: "fetchNativeRates")

                  let config = WKWebViewConfiguration()
                  config.userContentController = contentController

                  webView = WKWebView(frame: view.bounds, configuration: config)
                  webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  webView.isOpaque = false
                  webView.backgroundColor = UIColor(red: 2/255, green: 6/255, blue: 23/255, alpha: 1.0)
                  webView.scrollView.backgroundColor = UIColor(red: 2/255, green: 6/255, blue: 23/255, alpha: 1.0)
                  webView.scrollView.contentInsetAdjustmentBehavior = .never
                  fetcher.webView = webView

                  view.addSubview(webView)

                  if let htmlPath = Bundle.main.path(forResource: "index", ofType: "html"),
                     let htmlString = try? String(contentsOfFile: htmlPath, encoding: .utf8) {
                      webView.loadHTMLString(htmlString, baseURL: URL(string: "https://audtwd.local/"))
                  }
              }
          }

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.rootViewController = ViewController()
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          EOF

          xcrun -sdk iphoneos swiftc main.swift \
            -target arm64-apple-ios15.0 \
            -O \
            -framework UIKit \
            -framework WebKit \
            -framework Foundation \
            -o Payload/AUDTWDPro.app/AUDTWDPro

          cat << 'EOF' > Payload/AUDTWDPro.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>zh_TW</string>
            <key>CFBundleDisplayName</key>
            <string>匯兌精算Pro</string>
            <key>CFBundleExecutable</key>
            <string>AUDTWDPro</string>
            <key>CFBundleIdentifier</key>
            <string>com.sideloadtw.audtwdpro</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>AUDTWDPro</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>UIDeviceFamily</key>
            <array>
              <integer>1</integer>
              <integer>2</integer>
            </array>
            <key>UILaunchScreen</key>
            <dict/>
            <key>UIStatusBarStyle</key>
            <string>UIStatusBarStyleLightContent</string>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
            </array>
            <key>NSAppTransportSecurity</key>
            <dict>
              <key>NSAllowsArbitraryLoads</key>
              <true/>
            </dict>
          </dict>
          </plist>
          EOF

          echo -n "APPL????" > Payload/AUDTWDPro.app/PkgInfo
          codesign --force --sign - --timestamp=none Payload/AUDTWDPro.app
          zip -r -y AUD-TWD-Pro-Unsigned.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AUD-TWD-Pro-Unsigned-IPA
          path: AUD-TWD-Pro-Unsigned.ipa
